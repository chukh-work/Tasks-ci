name: "mcp-env artifact"

on:
  workflow_dispatch:
    inputs:
      package:
        description: "pip-пакет для установки"
        required: true
        default: "mcp-ssh-session"
      verify-command:
        description: "Команда проверки (по умолчанию <package> --help)"
        required: false
        default: ""
      artifact-name:
        description: "Имя артефакта (по умолчанию mcp-env-<package>)"
        required: false
        default: ""
      python-version:
        description: "Версия Python (3.12.7)"
        required: false
        default: "3.12.7"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: ./.github/actions/mcp-env-build
        with:
          package: ${{ inputs.package }}
          verify-command: ${{ inputs.verify-command }}
          artifact-name: ${{ inputs.artifact-name }}
          python-version: ${{ inputs.python-version }}
