name: Collect marketplace ids

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect ids
        env:
          MOODLE_MARKETPLACE_COOKIE: ${{ secrets.MOODLE_MARKETPLACE_COOKIE }}
        run: python3 marketplace/collect-ids.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ids_report
          path: |
            marketplace/ids_report.json
            marketplace/manifest.updated.json
          if-no-files-found: error
