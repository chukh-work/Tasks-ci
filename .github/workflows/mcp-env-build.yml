name: "mcp-env artifact"

on:
  workflow_dispatch:
    inputs:
      package:
        description: "pip-пакет для установки"
        required: true
        default: "mcp-ssh-session"
      artifact-name:
        description: "Имя артефакта (по умолчанию mcp-env-<package>)"
        required: false
        default: ""
      python-version:
        description: "Версия Python (3.12.7)"
        required: false
        default: "3.15.0"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare
        id: prepare
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:GITHUB_WORKSPACE "mcp-env"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }

          $parts = ("${{ inputs.package }}" -split "\s+" | Where-Object { $_ }) | ForEach-Object { ($_ -split "[=<>~!@;,\[\]]" | Select-Object -First 1) -replace "[^a-zA-Z0-9._-]", "-" }
          $slug = $parts -join "-"

          $name = "${{ inputs.artifact-name }}"
          if ([string]::IsNullOrWhiteSpace($name)) { $name = "mcp-env-$slug" }

          $ver = "${{ inputs.python-version }}"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "env_root=$root"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "python_exe=$(Join-Path $root 'python.exe')"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "scripts_dir=$(Join-Path $root 'Scripts')"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "package_slug=$slug"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "artifact_name=$name"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "zip_url=https://www.python.org/ftp/python/$ver/python-$ver-embed-amd64.zip"

      - name: Download and extract portable Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "python-embed.zip"
          Invoke-WebRequest -Uri "${{ steps.prepare.outputs.zip_url }}" -OutFile $zip -UseBasicParsing
          if (-not (Test-Path $zip)) { throw "Не удалось скачать zip с Python" }
          Expand-Archive -Path $zip -DestinationPath "${{ steps.prepare.outputs.env_root }}" -Force
          $pth = Get-ChildItem -Path "${{ steps.prepare.outputs.env_root }}" -Filter "python*._pth" -ErrorAction Stop | Select-Object -First 1
          (Get-Content $pth.FullName) -replace "^#import site", "import site" | Set-Content -Path $pth.FullName
          if (-not (Test-Path "${{ steps.prepare.outputs.python_exe }}")) { throw "python.exe не найден после распаковки" }

      - name: Bootstrap pip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $py = "${{ steps.prepare.outputs.python_exe }}"
          $getpip = Join-Path $env:RUNNER_TEMP "get-pip.py"
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile $getpip -UseBasicParsing
          & $py $getpip --no-warn-script-location
          if ($null -eq $LASTEXITCODE -or $LASTEXITCODE -ne 0) { throw "get-pip.py завершился с ошибкой (exit $LASTEXITCODE)" }
          & $py -m pip --version
          if ($null -eq $LASTEXITCODE -or $LASTEXITCODE -ne 0) { throw "pip --version завершился с ошибкой" }

      - name: Upgrade pip, setuptools, wheel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $py = "${{ steps.prepare.outputs.python_exe }}"
          & $py -m pip install --upgrade pip setuptools wheel
          if ($null -eq $LASTEXITCODE -or $LASTEXITCODE -ne 0) { throw "Не удалось обновить pip/setuptools/wheel (exit $LASTEXITCODE)" }

      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $py = "${{ steps.prepare.outputs.python_exe }}"
          $pkgs = "${{ inputs.package }}" -split "\s+" | Where-Object { $_ }
          & $py -m pip install @pkgs
          if ($null -eq $LASTEXITCODE -or $LASTEXITCODE -ne 0) { throw "pip install '${{ inputs.package }}' завершилась с ошибкой (exit $LASTEXITCODE)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: "mcp-env"
          if-no-files-found: error
